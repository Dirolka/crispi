<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-layer">
        <div class="falling-icons" id="falling-icons"></div>
    </div>
    <div class="content-layer">
        <div class="card" id="card">
            <p class="card-prompt" id="card-prompt">Кликай 25 раз</p>
            <p class="card-text hidden" id="card-text">От всей души желаю тебе удачи, счастья, что бы всегда шла только вперед. Я ценю то что у меня есть такие близкие как ты. Хочешь букет?</p>
        </div>
        <button class="btn btn-yes hidden" id="btn-yes">Да</button>
        <button class="btn btn-no hidden" id="btn-no">Нет</button>
    </div>
    <script>
        const videos = ['56433806.webm', '1470847491.webm', '1665340124.webm'];
        const container = document.getElementById('falling-icons');
        for (let i = 0; i < 48; i++) {
            const video = document.createElement('video');
            video.className = 'falling-icon';
            video.src = videos[i % 3];
            video.muted = true;
            video.autoplay = true;
            video.loop = true;
            video.playsInline = true;
            const duration = 8 + Math.random() * 10;
            video.style.left = (Math.random() * 95 + 2) + '%';
            video.style.animationDuration = duration + 's';
            video.style.animationDelay = -(Math.random() * duration) + 's';
            container.appendChild(video);
        }

        let clickCount = 0;
        const card = document.getElementById('card');
        const promptEl = document.getElementById('card-prompt');
        const textEl = document.getElementById('card-text');

        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');

        let yesClickCount = 0;

        function positionButtonsBelowCard() {
            const cardRect = card.getBoundingClientRect();
            const btnYesRect = btnYes.getBoundingClientRect();
            const btnNoRect = btnNo.getBoundingClientRect();
            const centerX = cardRect.left + (cardRect.width / 2);
            const topY = cardRect.bottom + 24;
            const gap = 16;
            btnYes.style.left = (centerX - gap / 2 - btnYesRect.width) + 'px';
            btnYes.style.top = topY + 'px';
            btnNo.style.left = (centerX + gap / 2) + 'px';
            btnNo.style.top = topY + 'px';
        }

        function moveButton(btn) {
            const rect = btn.getBoundingClientRect();
            const maxX = window.innerWidth - rect.width - 20;
            const maxY = window.innerHeight - rect.height - 20;
            const newX = Math.max(20, Math.random() * maxX);
            const newY = Math.max(20, Math.random() * maxY);
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
        }

        card.addEventListener('click', () => {
            clickCount++;
            if (clickCount < 25) {
                promptEl.textContent = `Кликай ${25 - clickCount} раз`;
            } else {
                promptEl.classList.add('hidden');
                textEl.classList.remove('hidden');
                btnYes.classList.remove('hidden');
                btnNo.classList.remove('hidden');
                requestAnimationFrame(() => requestAnimationFrame(positionButtonsBelowCard));
            }
        });

        btnNo.addEventListener('click', (e) => {
            e.stopPropagation();
            moveButton(btnNo);
        });

        btnYes.addEventListener('click', (e) => {
            e.stopPropagation();
            yesClickCount++;
            if (yesClickCount < 3) {
                moveButton(btnYes);
            } else if (yesClickCount === 3) {
                textEl.textContent = 'Хорошо, жди букет 14го числа';
            }
        });
    </script>
</body>
</html>
